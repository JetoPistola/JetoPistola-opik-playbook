[project]
name = "opik-py-redaction-pipeline"
version = "0.1.0"
description = "A document-redaction pipeline traced entirely by hand with the low-level Opik Python client."
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "opik==2.2.99",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]
