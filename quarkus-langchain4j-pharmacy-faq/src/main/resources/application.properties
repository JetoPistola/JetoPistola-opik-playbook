quarkus.application.name=quarkus-langchain4j-pharmacy-faq
quarkus.http.host=127.0.0.1
quarkus.http.port=5304
quarkus.devservices.enabled=false

# --- LLM -------------------------------------------------------------------------
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
quarkus.langchain4j.openai.chat-model.temperature=0.1
quarkus.langchain4j.openai.timeout=60s

# --- OpenTelemetry -> Opik ---------------------------------------------------------
# Opik has no Java SDK: it ingests plain OTLP, so the whole integration is this block.
quarkus.otel.traces.enabled=true
# Opik's OTLP endpoint speaks HTTP/protobuf (not gRPC).
quarkus.otel.exporter.otlp.protocol=http/protobuf
# No /v1/traces suffix: Quarkus appends it. Adding it yourself makes export fail silently.
quarkus.otel.exporter.otlp.traces.endpoint=${OPIK_OTEL_ENDPOINT:http://localhost:5173/api/v1/private/otel}
# Comet-Workspace picks the workspace, projectName the Opik project (auto-created on first trace).
# On Opik Cloud also add Authorization=<api key> here.
quarkus.otel.exporter.otlp.traces.headers=Comet-Workspace=${OPIK_WORKSPACE:default},projectName=${OPIK_PROJECT_NAME:quarkus-langchain4j-pharmacy-faq}
# batch span processor: export every 1s; remaining spans are flushed on graceful shutdown (SIGTERM)
quarkus.otel.bsp.schedule.delay=1s

pharmacy.docs-dir=docs

# Quarkus LangChain4j keeps prompt/completion text off spans unless asked; without these two flags the llm
# span in Opik has model, usage and cost but empty Input/Output. INCLUDE_CONTENT=false
# turns both off again (handy for seeing the difference in Opik).
quarkus.langchain4j.tracing.include-prompt=${INCLUDE_CONTENT:true}
quarkus.langchain4j.tracing.include-completion=${INCLUDE_CONTENT:true}

