[project]
name = "smolagents-weather-station-analyst"
version = "0.1.0"
description = "A smolagents CodeAgent answers questions about a weather-station CSV; its generated pandas code and execution logs are traced to Opik via OpenInference + OTLP"
requires-python = ">=3.12"
dependencies = [
    "smolagents[openai]>=1.20",
    "openinference-instrumentation-smolagents>=0.1.20",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "opik==2.2.99",
]
