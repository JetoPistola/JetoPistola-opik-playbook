[project]
name = "langgraph-boardgame-rules-rag"
version = "0.1.0"
description = "Rulebook Q&A over fictional board games: a two-node LangGraph graph traced and evaluated with Opik."
requires-python = ">=3.12"
dependencies = [
    "opik==2.2.99",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "numpy>=2.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
