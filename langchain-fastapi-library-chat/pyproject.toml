[project]
name = "langchain-fastapi-library-chat"
version = "0.1.0"
description = "A library book-recommendation chat API (FastAPI + LangChain) with scripted demo conversations."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "opik==2.2.99",
    "python-dotenv>=1.0",
]

[project.scripts]
library-chat = "library_chat.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["library_chat"]
