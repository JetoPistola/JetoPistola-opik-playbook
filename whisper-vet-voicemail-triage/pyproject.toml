[project]
name = "whisper-vet-voicemail-triage"
version = "0.1.0"
description = "After-hours vet voicemail triage (TTS -> transcription -> gpt-4o-mini), traced in Opik with playable audio attachments and a flakiness-tolerant test suite"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "opik==2.2.99",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
