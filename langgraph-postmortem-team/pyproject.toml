[project]
name = "langgraph-postmortem-team"
version = "0.1.0"
description = "An incident post-mortem agent team in LangGraph: lead, investigator loop, writer, traced as one Opik trace."
requires-python = ">=3.12"
dependencies = [
    "opik==2.2.99",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]
